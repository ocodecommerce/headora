name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:

  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22

    script: |
          set -Eeuxo pipefail

          cd /srv/headora/frontend

          echo "=== GIT REMOTE ==="
          git remote -v
          echo $== "=== GIT STATUS ==="
          git pull origin dev

          npm run build

          pm2 restart 0