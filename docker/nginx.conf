events {}
http {
  upstream headora_next {
    server nextjs-blue:3000 max_fails=2 fail_timeout=10s;
    server nextjs-green:3000 backup;
  }
  server {
    listen 80;
    location ~ ^/(graphql|rest|media|static|checkout|customer|paypal|braintree|headora)/ { proxy_pass http://magento:8080; }
    location /api/health { proxy_pass http://headora_next; access_log off; }
    location / { proxy_pass http://headora_next; proxy_next_upstream error timeout http_502 http_503; }
  }
}
